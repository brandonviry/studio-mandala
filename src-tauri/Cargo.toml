[package]
name = "mandala-layers-studio"
version = "0.1.0"
description = "Studio desktop hors ligne de mandalas composés par couches."
authors = ["Brandon Viry El"]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.77.2"

[lib]
name = "mandala_layers_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
